[workspace]
resolver = "2"
members = [
    "crates/td-common",
    "crates/td-ast",
    "crates/td-metrics",
    "crates/td-rules",
    "crates/td-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tree-sitter (runtime pinned to 0.25; grammar crates stay on their own
# published LINES — the runtime loads any grammar within its ABI window)
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-php = "0.23"
tree-sitter-ruby = "0.23"

# Internal
td-common = { path = "crates/td-common" }
td-ast = { path = "crates/td-ast" }
td-metrics = { path = "crates/td-metrics" }
td-rules = { path = "crates/td-rules" }

# Utilities
walkdir = "2"
regex = "1"
